name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: |
          echo "Dateien im Repository:"
          ls -la
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "FEHLER: Keine settings.gradle im Repository gefunden. Wurden die Projektdateien hochgeladen?"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Baue in Ordner: $DIR"
          cd "$DIR"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BattleLoot-jar
          path: "**/build/libs/*.jar"
